name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.85.0"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --locked -p minutes --target "${{ matrix.target }}"
          else
            cargo build --release --locked -p minutes --target "${{ matrix.target }}"
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BIN_DIR="target/${{ matrix.target }}/release"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="$BIN_DIR/minutes.exe"
          else
            BIN="$BIN_DIR/minutes"
          fi
          ASSET="minutes_${VERSION}_${{ matrix.target }}"
          mkdir -p dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (
              cd "$BIN_DIR"
              if command -v zip >/dev/null 2>&1; then
                zip -q "$GITHUB_WORKSPACE/dist/${ASSET}.zip" "$(basename "$BIN")"
              else
                powershell -Command "Compress-Archive -Path '$(basename "$BIN")' -DestinationPath '$GITHUB_WORKSPACE/dist/${ASSET}.zip'"
              fi
            )
            echo "ASSET_PATH=dist/${ASSET}.zip" >> "$GITHUB_ENV"
            echo "ASSET_NAME=${ASSET}.zip" >> "$GITHUB_ENV"
          else
            tar -C "$BIN_DIR" -czf "dist/${ASSET}.tar.gz" "$(basename "$BIN")"
            echo "ASSET_PATH=dist/${ASSET}.tar.gz" >> "$GITHUB_ENV"
            echo "ASSET_NAME=${ASSET}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ env.ASSET_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksum artifact
        if: startsWith(matrix.target, 'aarch64-apple-darwin') || startsWith(matrix.target, 'x86_64-apple-darwin')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brew-${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}
          retention-days: 1

  homebrew:
    name: homebrew
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Skip without tap token
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN not set; skipping Homebrew update."

      - name: Download Darwin artifacts
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: brew-*
          merge-multiple: true
          path: artifacts

      - name: Update Homebrew formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          ARM_ASSET="minutes_${VER}_aarch64-apple-darwin.tar.gz"
          INTEL_ASSET="minutes_${VER}_x86_64-apple-darwin.tar.gz"
          ARM_SHA="$(shasum -a 256 "artifacts/${ARM_ASSET}" | awk '{print $1}')"
          INTEL_SHA="$(shasum -a 256 "artifacts/${INTEL_ASSET}" | awk '{print $1}')"
          BASE="https://github.com/gabor-boros/minutes/releases/download/${TAG}"

          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/gabor-boros/homebrew-brew.git" tap
          mkdir -p tap/Formula

          cat > tap/Formula/minutes.rb <<FORMULA
          class Minutes < Formula
            desc "Sync worklogs between time trackers, invoicing, and bookkeeping software"
            homepage "https://github.com/gabor-boros/minutes"
            license "MIT"
            version "${VER}"

            on_macos do
              on_arm do
                url "${BASE}/${ARM_ASSET}"
                sha256 "${ARM_SHA}"
              end
              on_intel do
                url "${BASE}/${INTEL_ASSET}"
                sha256 "${INTEL_SHA}"
              end
            end

            def install
              bin.install "minutes"
            end

            test do
              assert_match "minutes", shell_output("#{bin}/minutes --help")
            end
          end
          FORMULA

          # Heredoc above indented formula; rewrite without leading spaces from the runner script.
          sed -i '' 's/^          //' tap/Formula/minutes.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/minutes.rb
          if git diff --cached --quiet; then
            echo "No formula changes"
            exit 0
          fi
          git commit -m "chore(minutes): update formula to ${VER}"
          git push
