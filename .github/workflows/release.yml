name: Release

on:
  # Releases created with GITHUB_TOKEN do not emit events, so
  # release-please.yml calls this workflow once all assets are uploaded.
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  homebrew:
    name: homebrew
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Skip without tap token
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN not set; skipping Homebrew update."

      - name: Download and verify release assets
        if: env.HOMEBREW_TAP_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            --pattern '*-apple-darwin.tar.gz' --pattern '*-apple-darwin.tar.gz.sha256'
          cd artifacts
          for f in *.sha256; do
            shasum -a 256 -c "$f"
          done

      - name: Update Homebrew formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          ARM_ASSET="minutes_${VER}_aarch64-apple-darwin.tar.gz"
          INTEL_ASSET="minutes_${VER}_x86_64-apple-darwin.tar.gz"
          ARM_SHA="$(shasum -a 256 "artifacts/${ARM_ASSET}" | awk '{print $1}')"
          INTEL_SHA="$(shasum -a 256 "artifacts/${INTEL_ASSET}" | awk '{print $1}')"
          BASE="https://github.com/gabor-boros/minutes/releases/download/${TAG}"

          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/gabor-boros/homebrew-brew.git" tap
          mkdir -p tap/Formula

          cat > tap/Formula/minutes.rb <<FORMULA
          class Minutes < Formula
            desc "Sync worklogs between time trackers, invoicing, and bookkeeping software"
            homepage "https://github.com/gabor-boros/minutes"
            license "MIT"
            version "${VER}"

            on_macos do
              on_arm do
                url "${BASE}/${ARM_ASSET}"
                sha256 "${ARM_SHA}"
              end
              on_intel do
                url "${BASE}/${INTEL_ASSET}"
                sha256 "${INTEL_SHA}"
              end
            end

            def install
              bin.install "minutes"
            end

            test do
              assert_match "minutes", shell_output("#{bin}/minutes --help")
            end
          end
          FORMULA

          # Heredoc above indented formula; rewrite without leading spaces from the runner script.
          sed -i '' 's/^          //' tap/Formula/minutes.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/minutes.rb
          if git diff --cached --quiet; then
            echo "No formula changes"
            exit 0
          fi
          git commit -m "chore(minutes): update formula to ${VER}"
          git push
